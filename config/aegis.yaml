# ═══════════════════════════════════════════════════════════
# AEGIS Configuration
# Adaptive Endpoint Guardian Intelligence System
# ═══════════════════════════════════════════════════════════

core:
  log_level: INFO
  log_file: logs/aegis.log
  log_json_file: logs/aegis.json.log
  log_max_bytes: 10485760   # 10 MB per log file before rotation
  log_backup_count: 14      # keep ~2 weeks of daily-ish rotations
  data_dir: data
  quarantine_dir: quarantine
  event_db: data/events.db

monitors:
  fim:
    enabled: true
    watch_paths:
      # Critical system paths — modify for your OS
      # Windows paths (primary target)
      - C:\Windows\System32
      - C:\Windows\SysWOW64
      - C:\Users
      # Linux paths (when running on Linux)
      - /etc
      - /usr/bin
      - /usr/sbin
      - /usr/lib
      - /home
      - /tmp
      - /var/tmp
    exclude_patterns:
      - "*.log"
      - "*.tmp"
      - "*.swp"
      - "__pycache__"
      - ".git"
    baseline_on_start: true
    hash_algorithm: sha256

  process:
    enabled: true
    poll_interval_ms: 500
    track_children: true
    capture_environ: true
    capture_cmdline: true
    suspicious_parents:
      # Processes that should rarely spawn children
      - svchost.exe
      - services.exe
      - lsass.exe
      - smss.exe
      - csrss.exe
      - wininit.exe
      # Linux equivalents
      - cron
      - atd

  network:
    enabled: true
    poll_interval_ms: 1000
    alert_on_new_listen: true
    alert_on_new_outbound: true
    trusted_ports:
      - 80
      - 443
      - 53
    suspicious_ports:
      - 4444    # Metasploit default
      - 5555    # Common RAT
      - 1337    # Common backdoor
      - 31337   # Back Orifice
      - 6666    # IRC (C2)
      - 6667    # IRC (C2)
      - 8888    # Common alt HTTP
      - 9001    # Tor
      - 9050    # Tor SOCKS

  resource:
    enabled: true
    poll_interval_ms: 5000
    cpu_threshold_percent: 85
    cpu_sustained_seconds: 30
    memory_growth_mb_per_min: 500
    disk_write_mb_per_sec: 100

  # ─── Persistence-mechanism scanner ──────────────────────────
  # Snapshots Run keys, Scheduled Tasks, Services, WMI subs,
  # Startup folders, IFEO, AppInit_DLLs (Windows) and cron /
  # systemd / ld.so.preload (Linux). First poll establishes the
  # baseline; subsequent diffs publish PROC_SUSPICIOUS events.
  persistence:
    enabled: true
    poll_interval_ms: 300000   # 5 minutes
    baseline_path: data/persistence.baseline.json

  # ─── DNS + TLS SNI capture ──────────────────────────────────
  # On Windows this polls `ipconfig /displaydns` for new domains;
  # SNI capture is off by default (requires scapy + npcap).
  dns:
    enabled: true
    poll_interval_seconds: 30
    sni_capture: false         # set true if scapy + npcap installed

  # ─── eBPF process tracer (Linux only) ──────────────────────
  # Push-based replacement for the psutil polling above. Hooks the
  # kernel `sched_process_exec` tracepoint and emits `proc.create`
  # events with sub-millisecond latency — no missed PIDs from short-
  # lived fork+exec+exit chains. Soft-fails on non-Linux / missing
  # bcc / insufficient privileges. Requires CAP_BPF or root.
  #
  # IMPORTANT: when this is enabled on a Linux host, set
  # `monitors.process.enabled: false` to avoid duplicate proc.create
  # events. On Windows / macOS, leave both at their defaults — the
  # eBPF monitor self-disables and `process` keeps polling.
  proc_ebpf:
    enabled: false
    ringbuf_pages: 64        # 64 × 4 KB = 256 KB perf-buffer per CPU
    poll_interval_ms: 100

  # ─── Honeytoken canaries ───────────────────────────────────
  # Plant decoy files in attacker-attractive locations and watch
  # for any modification or deletion. Ransomware encrypts every
  # canary it walks; credential thieves grep `passwords.txt` /
  # `aws/credentials`. Detection FP rate is essentially zero by
  # construction. plant_on_start refuses to overwrite pre-existing
  # files at the canary path — operator data is sacred.
  honey:
    enabled: true
    poll_interval_seconds: 60
    plant_on_start: true
    plant_user_dirs: true
    auto_replant: false        # restore deleted canaries on next poll
    baseline_path: data/honey.baseline.json
    extra_canaries: []         # e.g. [{path: D:/share/secrets.txt, template: passwords}]

detection:
  yara:
    enabled: true
    rules_dir: rules/yara
    scan_on_create: true
    scan_on_modify: true
    scan_timeout_seconds: 30
    max_file_size_mb: 100
    # Path substrings and file extensions to skip on top of the built-in
    # excludes (browser caches, Windows event logs, SQLite DBs, VS Code
    # workspace state, AEGIS's own data dir, etc.). String-based YARA rules
    # FP heavily against those — scan binaries and scripts, not text caches.
    exclude_paths: []          # e.g. ["/MyApp/cache/"]
    exclude_extensions: []     # e.g. [".cache", ".pack"]

  behavioral:
    enabled: true
    rules_dir: rules/behavioral
    correlation_window_seconds: 10

  anomaly:
    enabled: true
    model_path: data/anomaly_model.pkl
    training_period_hours: 24
    min_training_samples: 200
    contamination: 0.01
    auto_train: true
    # Severity for an Isolation Forest hit. Audit found ~50/day with
    # most being score-tail noise — keep MEDIUM unless you've tuned the
    # contamination factor. Values: info | low | medium | high | critical.
    severity: medium
    # Storm breaker: cap how many anomaly events publish per window.
    # When more than `threshold` admit inside `window_s`, suppress
    # further detections for `cool_off_s`.
    storm_breaker:
      enabled: true
      threshold: 5
      window_s: 300            # 5 minutes
      cool_off_s: 300          # silence for 5 minutes once tripped
    features:
      - cpu_percent
      - memory_mb
      - open_fds
      - child_count
      - net_connections
      - file_writes_per_sec
      - cmdline_entropy

  supply_chain:
    enabled: true
    typosquat_max_distance: 2
    malicious_db_path: rules/supply_chain/known_malicious.json
    # ─── Host SBOM (CycloneDX 1.5) ─────────────────────────
    # Periodically writes a Software Bill of Materials listing
    # every pip and (globally-installed) npm package on this
    # host. Output is SIEM/Dependency-Track-friendly JSON. Off
    # by default; enable when you want supply-chain inventory
    # for the audit trail.
    sbom:
      enabled: false
      path: data/sbom.cdx.json
      interval_hours: 24
      include_npm: true
      emit_on_start: true

  # ─── Sigma rule loader ───────────────────────────────────────
  # Translates a subset of SigmaHQ process_creation rules into
  # AEGIS behavioral rules at startup. Drop any .yml/.yaml from
  # https://github.com/SigmaHQ/sigma into rules_dir.
  sigma:
    enabled: false
    rules_dir: rules/sigma
    max_rules: 0               # 0 = no cap

  # ─── Threat-intel feeds ──────────────────────────────────────
  # Pulls public IOC feeds (URLhaus, Feodo, ThreatFox,
  # DigitalSide) hourly and flags matching domains/IPs/hashes.
  # Cache survives restarts.
  threat_intel:
    enabled: true
    refresh_seconds: 3600
    cache_path: data/threat_intel_cache.json

  # ─── AMSI client (Windows-only) ──────────────────────────────
  # Hands every script-class file (.ps1, .vbs, .js, .bat, …) written
  # to a watched path through the host's AMSI providers (Windows
  # Defender by default) BEFORE it can execute. Defender's verdict
  # surfaces as a `detection.amsi` event. No-op on non-Windows.
  # `publish_clean_results: true` floods the bus with INFO-level
  # scan receipts — keep off unless you specifically want them for
  # OCSF audit trails.
  amsi:
    enabled: true
    app_name: AEGIS-EDR
    max_file_size_mb: 16
    publish_clean_results: false
    extensions:
      - .ps1
      - .psm1
      - .psd1
      - .ps1xml
      - .vbs
      - .vbe
      - .js
      - .jse
      - .wsf
      - .wsh
      - .bat
      - .cmd
      - .hta
      - .lnk

  # ─── Local LLM alert triage ──────────────────────────────────
  # Subscribes to response.alert and produces a one-paragraph
  # narrative + confidence label + suggested next steps. Requires
  # `pip install llama-cpp-python` and a GGUF model file in
  # models/. Output is ADVISORY ONLY — never feeds destructive
  # actions. Disabled by default; flip enabled=true once you've
  # downloaded a model.
  llm_triage:
    enabled: false
    model: qwen-2.5-3b       # qwen-2.5-3b (default) | phi-3.5-mini | llama-3.2-3b | qwen-2.5-7b | phi-4
    models_dir: models
    n_ctx: 4096
    max_tokens_out: 256
    queue_size: 64

response:
  auto_respond: true
  # Per-source override of auto_respond. Anomaly detector (source=
  # "anomaly") defaults to false because Isolation Forest score-tail
  # hits are too lossy to trigger destructive actions; a manual-action
  # alert is still published. Other sources fall back to the flag above.
  auto_respond_sources:
    anomaly: false
  # ─── Forensics retention ───────────────────────────────────
  # Snapshot files (data/forensics/snapshot_*.json) accumulated
  # to ~340 MB/day in production audit. `purge_expired` now
  # rotates them alongside quarantine. Snapshots whose case_id
  # is still referenced by a quarantine meta are protected.
  forensics:
    retention_days: 30          # 0 disables forensics rotation
  # ─── Quarantine allow-list ─────────────────────────────────
  # Paths the engine will REFUSE to quarantine, even on a high-
  # severity detection. The defaults already protect Microsoft
  # OneAuth / TokenBroker, Chrome / Edge / Firefox profiles,
  # OneDrive, Outlook .ost/.pst, Linux ~/.ssh, ~/.gnupg, etc.
  # Add deployment-specific paths here (case-insensitive
  # substring match against the absolute path).
  quarantine:
    allow_list_paths: []        # e.g. ["\\company\\creds\\", "/opt/secret/"]
  severity_actions:
    critical:
      - kill_process
      - quarantine_file
      - forensic_snapshot
      - alert
    high:
      - quarantine_file
      - alert
      - forensic_snapshot
    medium:
      - alert
      - log
    low:
      - log

dashboard:
  enabled: true
  refresh_interval_ms: 1000
  max_events_displayed: 50
  max_alerts_displayed: 20

# ─── Web dashboard ────────────────────────────────────────────
# Loopback FastAPI/HTMX UI for live triage. http://127.0.0.1:8765
dashboard_web:
  enabled: true
  host: 127.0.0.1
  port: 8765

# ─── Self-protection / tamper resistance ─────────────────────
# manifest_check: hash config + rules at startup, fail (or warn) on drift.
# strict:         true → SystemExit on any mismatch; false → warn-only.
# parent_check:   refuse to start if parent isn't services.exe / NSSM / shell.
# watchdog:       spawn a detached supervisor process that respawns AEGIS
#                 if our PID dies unexpectedly (turn off for dev work).
self_protect:
  manifest_check: true
  strict: false
  parent_check: false
  watchdog: false
  # `require_attestation`: when true, an integrity manifest without a
  # valid TPM-bound ECDSA signature is rejected even if every SHA-256
  # hash matches. Turn on once you've built a manifest on a host with
  # a working TPM (Windows 8+ Platform Crypto Provider). Off by default
  # so existing SHA-256 manifests keep working through rollout.
  require_attestation: false
  # ─── Process mitigation policies (Windows) ─────────────────
  # Calls SetProcessMitigationPolicy at bootstrap to harden AEGIS's
  # own surface. Safe-by-default bundle: ExtensionPointDisable,
  # StrictHandleCheck, ImageLoad (NoRemote/NoLowLabel/PreferSystem32),
  # FontDisable. No-op on non-Windows. `aggressive` adds
  # ProhibitDynamicCode + NoChildProcessCreation — these BREAK
  # subprocess.run usage in --harden, persistence monitor, hardening
  # recheck. Only enable when those are run from a separate process.
  process_mitigations:
    enabled: true
    aggressive: false

# ─── Daily rule auto-update ───────────────────────────────────
rule_updates:
  enabled: false           # turn on once you've vetted the upstream sources
  interval_hours: 24

# ─── Outbound alerting ────────────────────────────────────────
# Webhook: Slack, Discord, Teams, or any JSON-receiving endpoint.
# Email:   SMTP — leave smtp_host blank to disable.
alerting:
  # ─── OCSF v1.1.0 export ────────────────────────────────────
  # Writes every AEGIS event in OCSF JSON-lines for SIEM ingest
  # (Splunk Forwarder / Filebeat / Vector tailing the file). The
  # full event stream — not just alerts — so the hash-chained log
  # is portable as an audit artifact. Off by default; enable when
  # you've decided where to drain the file.
  ocsf:
    enabled: false
    path: logs/ocsf.json
    max_bytes: 10485760       # 10 MB per rotation
    backup_count: 7
    product_name: AEGIS
    product_vendor: AEGIS
    product_version: "0.2.0"
    schema_version: "1.1.0"
  webhook:
    url: ""                   # e.g. https://hooks.slack.com/services/...
    style: generic            # generic | slack | discord | teams
    min_severity: high        # info | low | medium | high | critical
    timeout_seconds: 5
  toast:
    enabled: true              # Native Windows 10/11 toast popups (requires `pip install winotify`)
    min_severity: high         # info | low | medium | high | critical
    app_id: AEGIS
    icon_path: ""              # absolute path to a .ico file (optional)
  email:
    smtp_host: ""             # e.g. smtp.gmail.com
    smtp_port: 587
    smtp_username: ""
    smtp_password: ""         # or set AEGIS_SMTP_PASSWORD env var
    from_address: aegis@localhost
    to_addresses: []          # list of recipients
    min_severity: critical
